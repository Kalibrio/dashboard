<head>

<style>
  :root { --bg:#ffffff; --card:#f7f8fa; --ink:#3d4b5c; --ink-strong:#33404f; --ink-dim:#8a94a3; --line:#e4e7ec; --red:#c22a29; --neg:#d8382e; --green:#7cc142; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:17px; line-height:1.45; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; width:100%; max-width:360px; }
  h1 { font-size:1.55rem; font-weight:700; color:var(--ink-strong); letter-spacing:-0.01em; margin-bottom:4px; }
  p.sub { color:var(--ink-dim); font-size:.95rem; margin-bottom:18px; }
  label { display:block; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:6px; }
  input { width:100%; font:inherit; font-size:1.05rem; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink-strong); outline:none; }
  input:focus { border-color:var(--ink-dim); }
  button { margin-top:14px; width:100%; font:inherit; font-weight:600; font-size:1.05rem; padding:12px 14px; border:0; border-radius:10px; background:var(--red); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--neg); font-size:.95rem; margin-top:12px; min-height:1.4em; }
  .err a { color:var(--link,#2f6fd0); }
</style>
