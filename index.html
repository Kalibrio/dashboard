<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<meta name="description" content="Arbitrage cycle dashboard. Status, daily and weekly metrics, and cycle-level P&L.">
<meta name="robots" content="noindex">
<style>

    --green:     #7cc142;
    --green-text:#4d9427;
    --green-soft:#eef7e6;
    --amber:     #e8912d;
    --amber-text:#a86a12;

  button.i {

  .defcard { background: #fff; border-radius: 14px; padding: 22px 24px; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .defcard h3 { font-size: 1.05rem; color: var(--ink-strong); margin-bottom: 8px; }

  .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 0; }

  @media (max-width: 639px) { .desk { display: none !important; } }
  @media (min-width: 640px) { .mob { display: none !important; } }

<body>
<div class="wrap">
  <header><h1>Dashboard</h1><span class="clock" id="clock"></span></header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>

  <main id="view"></main>

<!-- To display live bot output, place a data.json next to this page:
  {"capital": 30000, "cycles": [{"id": 167239, "ts": "2026-09-03T09:31:00Z", "cycle": "USDT-ARB-USDC-USDT",
   "amount": 500, "profit": 19.87, "expectedPct": 1.89, "durationMs": 734, "balanceAfter": 37049.62,
   "legs": [{"pair": "ARBUSDT [BUY]", "wanted": 20.82, "executed": 20.8113, "durationMs": 734.5, "slippagePct": -0.04}]}, …]}
  Optional fields: exchange, capacity. Without data.json the page renders built-in demo data. -->
</div>

<script>
'use strict';

/* ---------- data ---------- */

const DAY = 86400000;
let DATA = null; // {capital, cycles:[{id, ts, cycle, amount, profit, expectedPct, durationMs, balanceAfter, legs[]}]}
let LOAD_FAILED = false;

// Deterministic PRNG so the demo numbers are stable between visits.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function demoData() {
  const rnd = mulberry32(20260903);
  const legsPool = ['ARB', 'INJ', 'MANTA', 'TIA', 'PEPE', 'AUCTION', 'TKO', 'LAZIO', 'BLUR', 'SOL', 'DOGE', 'OP', 'SUI', 'WLD', 'JUP', 'ENS', 'MEME', 'BONK', 'DEGO', 'UNFI'];
  const mids = ['USDC', 'FDUSD', 'BTC', 'TRY', 'ETH', 'EUR'];
  const cycles = [];
  const now = Date.now();
  let id = 150000;
  for (let d = 179; d >= 0; d--) {
    const dayStart = now - d * DAY;
    const n = 35 + Math.floor(rnd() * 40);
    // Bias drifts so different ranges show different-looking totals (incl. losing stretches).
    const bias = Math.sin(d / 11) * 0.35 + (d > 60 && d < 120 ? -0.25 : 0.12);
    for (let i = 0; i < n; i++) {
      const win = rnd() < 0.574 + bias * 0.08;
      const mag = Math.pow(rnd(), 1.6);
      const profit = win ? +(mag * 22 + 0.4).toFixed(2) : -+(mag * 18 + 0.3).toFixed(2);
      const a = legsPool[Math.floor(rnd() * legsPool.length)];
      const b = mids[Math.floor(rnd() * mids.length)];
      const three = rnd() < 0.5;
      const cycle = three ? `USDT-${a}-${b}` : `USDT-${b}-${a}-USDT`;
      const amount = rnd() < 0.93 ? 500 : +(300 + rnd() * 250).toFixed(2);
      const pairs = three
        ? [`${a}USDT [BUY]`, `${a}${b} [SELL]`]
        : [`${b}USDT [BUY]`, `${a}${b} [BUY]`, `${a}USDT [SELL]`];
      const legRows = pairs.map(p => {
        const wanted = +(rnd() * 40 + 0.5).toFixed(2);
        const slip = +((rnd() - 0.45) * (win ? 0.6 : 6)).toFixed(2);
        return {
          pair: p,
          wanted,
          executed: +(wanted * (1 - slip / 100)).toFixed(6),
          durationMs: +(rnd() * 4000 + 30).toFixed(3),
          slippagePct: slip
        };
      });
      const exch = rnd() < 0.8 ? 'Binance' : ['Kraken', 'Gate', 'Okex'][Math.floor(rnd() * 3)];
      cycles.push({
        id: id++,
        ts: dayStart - Math.floor(rnd() * DAY),
        cycle, amount, profit,
        exchange: exch,
        capacity: +(amount * (1 + rnd() * 2.5)).toFixed(2),
        expectedPct: +(rnd() * 2.4 + 0.2).toFixed(2),
        durationMs: +legRows.reduce((s, l) => s + l.durationMs, 0).toFixed(3),
        legs: legRows
      });
    }
  }
  cycles.sort((x, y) => x.ts - y.ts);
  let bal = 30000;
  for (const c of cycles) { bal += c.profit; c.balanceAfter = +bal.toFixed(2); }
  cycles.reverse();
  return { capital: 30000, cycles };
}

async function loadData() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (res.ok) {
      const j = await res.json();
      j.cycles.forEach(c => { c.ts = typeof c.ts === 'number' ? c.ts : Date.parse(c.ts); });
      j.cycles.sort((x, y) => y.ts - x.ts);
      DATA = j;
      return;
    }
    if (res.status !== 404) { LOAD_FAILED = true; }
  } catch (e) {
    // A thrown fetch is a real network failure on http(s); under file:// preview it's expected.
    if (location.protocol.startsWith('http')) LOAD_FAILED = true;
  }
  DATA = demoData();
}

/* ---------- helpers ---------- */

const fmtUsd = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = n => n.toFixed(2) + '%';

function inRange(fromMs, toMs) {
  return DATA.cycles.filter(c => c.ts >= fromMs && c.ts < toMs);
}

function stats(list, days) {
  const s = { n: list.length, profit: 0, volume: 0, gain: 0, loss: 0, wins: 0 };
  const gains = [], losses = [];
  for (const c of list) {
    s.profit += c.profit;
    s.volume += c.amount;
    if (c.profit >= 0) { s.wins++; s.gain += c.profit; gains.push(c.profit); }
    else { s.loss += c.profit; losses.push(c.profit); }
  }
  gains.sort((a, b) => b - a); losses.sort((a, b) => a - b);
  s.topGainShare = s.gain > 0 ? gains.slice(0, 5).reduce((a, b) => a + b, 0) / s.gain * 100 : 0;
  s.topLossShare = s.loss < 0 ? losses.slice(0, 5).reduce((a, b) => a + b, 0) / s.loss * 100 : 0;
  s.winrate = s.n ? s.wins / s.n * 100 : 0;
  s.profitPct = DATA.capital ? s.profit / DATA.capital * 100 : 0;
  s.dailyAvg = s.profit / days;
  s.dailyAvgPct = DATA.capital ? s.dailyAvg / DATA.capital * 100 : 0;
  return s;
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* Metric definitions shown by the ⓘ icon next to each title. */
const DEFS = {
  'Engine': 'Whether the trading engine is running.',
  'Last Cycle': 'Completion time of the most recent arbitrage cycle.',
  'Cycles Today': 'Number of arbitrage cycles completed today.',
  'Profit Today': 'Net profit generated today in USD. In brackets: as a percentage of capital.',
  'Current Balance': 'Account balance after the most recent cycle.',
  'Current balance': 'Account balance after the most recent cycle.',
  'Capital': 'The capital base used for percentage calculations.',
  'Total Profit': 'Net profit over the selected period in USD. In brackets: as a percentage of capital.',
  'Winrate': 'Percentage of cycles that closed with a positive result.',
  'Cycles': 'Number of arbitrage cycles completed in the selected period.',
  'Total Gain': 'Sum of all positive cycle results. In brackets: the share contributed by the 5 biggest winners.',
  'Total Loss': 'Sum of all negative cycle results. In brackets: the share contributed by the 5 biggest losers.',
  'Total Volume': 'Total traded volume in USD over the period.',
  'Daily Average Profit': 'Total profit divided by the number of days in the period. In brackets: as a percentage of capital.',
  'Profit': 'Net profit for that day.',
  'Balance': 'Account balance at the end of that day.',
  'Top Earners': 'The most profitable cycles of the day. Click an id for full details.',
  'Top Losers': 'The most losing cycles of the day. Click an id for full details.',
  'Id': 'Unique cycle identifier. Click for full details.',
  'Date': 'Cycle completion time.',
  'Cycle': 'The pair path traded by this arbitrage cycle.',
  'Capacity': 'Maximum amount the order books could absorb for this cycle.',
  'Amount': 'Amount actually committed to the cycle in USD.',
  'Amount (usd)': 'Amount actually committed to the cycle in USD.',
  'Profit Expected (%)': 'Profit predicted before execution, as a percentage of the amount.',
  'Profit Actual (%)': 'Realized profit as a percentage of the amount.',
  'Profit Actual (usd)': 'Realized profit in USD.',
  'Profit Expected, %': 'Profit predicted before execution, as a percentage of the amount.',
  'Profit Actual, %': 'Realized profit as a percentage of the amount.',
  'Profit Actual, usd': 'Realized profit in USD.',
  'Duration (ms)': 'Total execution time of the cycle in milliseconds.',
  'Duration': 'Execution time.',
  'Time': 'Cycle completion time.',
  'Exchange': 'Exchange where the cycle executed.',
  'Amount Used, %': 'Committed amount as a percentage of available capacity.',
  'Balance Before': 'Account balance before the cycle.',
  'Balance After': 'Account balance after the cycle.',
  'Pair': 'The traded pair and side for this leg of the cycle.',
  'Price Wanted': 'Price targeted when the leg was submitted.',
  'Price Executed': 'Price actually filled.',
  'Slippage': 'Difference between wanted and executed price, in percent.'
};

const infoLabel = k => DEFS[k]
  ? `${k}<button class="i" data-def="${esc(k)}" aria-label="What is ${esc(k)}?">i</button>` : k;

function kvRow(k, vHtml) {
  return `<div class="row"><span class="k">${infoLabel(k)}</span><span class="v">${vHtml}</span></div>`;
}

function sq(cls) { return `<span class="sq ${cls}"></span>`; }

function chipRow(items, selIdx, onName) {
  return `<div class="chips">` + items.map((t, i) =>
    `<button class="chip${i === selIdx ? ' sel' : ''}" data-act="${onName}" data-i="${i}">${t}</button>`
  ).join('') + `</div>`;
}

function cyclesTable(list, { firstCol } = {}) {
  if (!list.length) return `<div class="kv">${kvRow('No cycles', '—')}</div>`;
  return `<div class="tblwrap"><table class="data">
    <thead><tr>${firstCol ? `<th>${infoLabel(firstCol)}</th>` : ''}<th>${infoLabel('Cycle')}</th><th>${infoLabel('Amount')}</th><th>${infoLabel('Profit')}</th></tr></thead>
    <tbody>` + list.map(c => `<tr>
      ${firstCol ? `<td><a href="#/cycle/${c.id}">${c.id}</a></td>` : ''}
      <td class="pair">${esc(c.cycle)}</td>
      <td>${fmtUsd(c.amount)} usd</td>
      <td>${sq(c.profit >= 0 ? 'up' : 'loss')}${fmtUsd(c.profit)} usd</td>
    </tr>`).join('') + `</tbody></table></div>`;
}

/* ---------- format helpers ---------- */

const money = (n, opts = {}) => {
  const sign = n < 0 ? '−' : (opts.plus && n > 0 ? '+' : '');
  const a = Math.abs(n);
  const s = a >= 1000
    ? a.toLocaleString('en-US', { maximumFractionDigits: 0 })
    : a.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `${sign}$${s}`;
};
const pct0 = n => `${Math.round(n)}%`;
const pct2 = n => `${n < 0 ? '−' : ''}${Math.abs(n).toFixed(2)}%`;
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtDay = ts => new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDayShort = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`;
  const d = Math.floor(h / 24);
  return `${d} day${d === 1 ? '' : 's'} ago`;
}
function startOfDay(offset) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return d.getTime() - offset * DAY;
}
function dayLabel(off) {
  if (off === 0) return 'Today';
  if (off === 1) return 'Yesterday';
  return fmtDay(startOfDay(off) + DAY / 2);
}
const dur = ms => ms == null ? '—' : ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(1)} s`;
const cyclePath = c => esc(String(c).split('-').join(' · '));

function deltaPill(cur, base, label, opts = {}) {
  if (!(Math.abs(base) > 0)) return `<span class="pill">no baseline yet</span>`;
  const r = (cur - base) / Math.abs(base) * 100;
  const txt = `${r > 0 ? '+' : r < 0 ? '−' : ''}${Math.round(Math.abs(r))}% ${label}`;
  if (Math.abs(r) < 5) return `<span class="pill">in line · ${label}</span>`;
  const good = opts.lowerIsBetter ? r < 0 : r > 0;
  const cls = good ? 'green' : (Math.abs(r) >= 25 ? 'red' : 'amber');
  return `<span class="pill ${cls}">${txt}</span>`;
}
function deltaText(cur, base) {
  if (!(Math.abs(base) > 0)) return { txt: '—', cls: '' };
  const r = (cur - base) / Math.abs(base) * 100;
  if (Math.abs(r) < 5) return { txt: 'in line', cls: '' };
  return { txt: `${r > 0 ? '+' : '−'}${Math.round(Math.abs(r))}%`, cls: r > 0 ? 'up' : (r <= -25 ? 'bad' : 'down') };
}

function sparkline(pts, { avg = null, color = '#2f6fd0', h = 64 } = {}) {
  if (pts.length < 2) return '';
  const w = 400, max = Math.max(...pts, avg == null ? -Infinity : avg), min = Math.min(...pts, avg == null ? Infinity : avg);
  const x = k => (k / (pts.length - 1)) * w;
  const y = v => h - 6 - ((v - min) / (max - min || 1)) * (h - 14);
  const d = pts.map((v, k) => `${k ? 'L' : 'M'}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const avgLine = avg != null ? `<line x1="0" y1="${y(avg).toFixed(1)}" x2="${w}" y2="${y(avg).toFixed(1)}" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"></line>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" fill-opacity="0.12"></path>${avgLine}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${w}" cy="${y(pts[pts.length - 1]).toFixed(1)}" r="3.5" fill="${color}"></circle></svg>`;
}

function barChart(items, avg) {
  const max = Math.max(...items.map(i => Math.abs(i.value)), 1);
  const best = Math.max(...items.filter(i => !i.today).map(i => i.value));
  return `<div class="bars">` + items.map(i => {
    const hpct = Math.max(4, Math.abs(i.value) / max * 100);
    const cls = i.today ? 'today' : i.value < 0 ? 'neg' : i.value === best ? 'hi' : (avg != null && i.value < avg) ? 'lo' : '';
    return `<div class="bar ${cls}" style="height:${hpct.toFixed(1)}%" title="${esc(i.label)}: ${money(i.value)}"></div>`;
  }).join('') + `</div>` + (items.length <= 14 ? `<div class="bx">` + items.map(i => `<span>${esc(i.label)}</span>`).join('') + `</div>` : `<div class="axis"><span>${esc(items[0].label)}</span><span>${esc(items[items.length - 1].label)}</span></div>`);
}

const tile = (label, value, delta, cls = '', defKey) =>
  `<div class="tile ${cls}"><div class="l">${infoLabel(defKey || label)}</div><div class="v">${value}</div>${delta ? `<div class="d ${delta.cls || ''}">${delta.txt}</div>` : ''}</div>`;

function card({ href, hd, title, sub, a, b, acls = '', cls = '' }) {
  const tag = href ? 'a' : 'div';
  return `<${tag}${href ? ` href="${href}"` : ''} class="card ${cls}">${hd ? `<span class="hd ${hd}"></span>` : ''}<div class="body"><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>${a != null ? `<div class="num"><div class="a ${acls}">${a}</div>${b ? `<div class="b">${b}</div>` : ''}</div>` : ''}${href ? '<span class="chev"></span>' : ''}</${tag}>`;
}

function rail(items, selIdx, act) {
  return `<div class="rail">` + items.map((t, i) =>
    `<button class="chip${i === selIdx ? ' sel' : ''}" data-act="${act}" data-i="${i}">${t}</button>`).join('') + `</div>`;
}

const sqi = v => `<span class="sqi ${v > 0 ? 'green' : v < 0 ? 'red' : 'grey'}"></span>`;
function cycleCard(c, { showDay = false, badge = '', sq = false } = {}) {
  const pct = c.profit / c.amount * 100;
  return card({ href: `#/cycle/${c.id}`, title: cyclePath(c.cycle),
    sub: `${showDay ? fmtDayShort(c.ts) + ' ' : ''}${fmtTime(c.ts)}${c.exchange ? ` · ${esc(c.exchange)}` : ''} · ${money(c.amount)}${c.durationMs != null ? ` · ${dur(c.durationMs)}` : ''}`,
    a: money(c.profit, { plus: true }) + (sq ? sqi(c.profit) : ''), b: pct2(pct), acls: badge ? `badge ${badge}` : (c.profit > 0 ? 'pos' : c.profit < 0 ? 'negv' : 'dim') });
}

function cycleRows(list, { showDay = false } = {}) {
  if (!list.length) return `<div class="list">${card({ title: 'No cycles', sub: '' })}</div>`;
  const mob = `<div class="list mob">` + list.map(c => cycleCard(c, { showDay, sq: true })).join('') + `</div>`;
  const desk = `<div class="tblwrap desk"><table class="data">
    <thead><tr>${['Time', 'Cycle', 'Exchange', 'Amount', 'Profit Expected (%)', 'Profit Actual (%)', 'Profit', 'Duration', 'Id'].map((h, i) => `<th class="${i >= 3 && i <= 7 ? 'r' : ''}">${infoLabel(h)}</th>`).join('')}</tr></thead>
    <tbody>` + list.map(c => `<tr>
      <td>${showDay ? fmtDayShort(c.ts) + ' ' : ''}${fmtTime(c.ts)}</td>
      <td>${cyclePath(c.cycle)}</td>
      <td>${esc(c.exchange || '—')}</td>
      <td class="r">${money(c.amount)}</td>
      <td class="r dim">${c.expectedPct != null ? pct2(c.expectedPct) : '—'}</td>
      <td class="r">${pct2(c.profit / c.amount * 100)}</td>
      <td class="r ${c.profit > 0 ? 'pos' : c.profit < 0 ? 'negv' : 'dim'}">${money(c.profit, { plus: true })}${sqi(c.profit)}</td>
      <td class="r">${dur(c.durationMs)}</td>
      <td><a href="#/cycle/${c.id}">${c.id}</a></td>
    </tr>`).join('') + `</tbody></table></div>`;
  return mob + desk;
}

/* Daily profit and closing balance for the last n complete days, oldest first. */
function dailyProfits(n) {
  const out = [];
  for (let off = n; off >= 1; off--) {
    const f = startOfDay(off);
    const list = inRange(f, f + DAY);
    const close = DATA.cycles.find(c => c.ts < f + DAY);
    out.push({ off, f, v: list.reduce((a, c) => a + c.profit, 0), n: list.length, bal: close ? close.balanceAfter : null });
  }
  return out;
}

Object.assign(DEFS, {
  'Balance': 'Account balance after the most recent cycle. The curve shows the closing balance of each of the last 30 days.',
  'Return on capital': 'Current balance minus capital, as a share of capital.',
  'Win rate': 'Share of cycles that closed with a positive result.',
  'Cycles today': 'Cycles completed since midnight, against the average count reached by this time of day over the last 30 days.',
  'Volume': 'Total amount committed across cycles in the period.',
  'Best day': 'The most profitable day of the period.',
  'Concentration': 'Share of total gains contributed by the five biggest winning cycles.',
  'Capacity used': 'Committed amount as a share of the capacity the order books could absorb.'
});

const errBox = `<div class="err">Load failed</div>`;

/* ---------- views ---------- */

const DAY_CHIPS = () => [0, 1, 2, 3, 4, 5, 6].map(dayLabel);
const RANGE_CHIPS = ['Last 7 days', 'Last 14 days', 'Last 30 days', 'Last 60 days', 'Last 90 days', 'Last 180 days'];
const RANGE_DAYS = [7, 14, 30, 60, 90, 180];
const state = { dayIdx: 0, rangeIdx: 2, exch: {}, custom: null, pickOpen: false };
const CAL_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"></rect><path d="M2 7h12M5 1.5v3M11 1.5v3"></path></svg>';
const isoDay = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function dayRail() {
  const c = state.custom;
  const label = c ? (c.to - c.from <= DAY ? fmtDay(c.from + DAY / 2) : `${fmtDayShort(c.from + DAY / 2)} – ${fmtDayShort(c.to - DAY / 2)}`) : 'Pick dates';
  return `<div class="rail">` + DAY_CHIPS().map((t, i) => `<button class="chip${!c && i === state.dayIdx ? ' sel' : ''}" data-act="day" data-i="${i}">${t}</button>`).join('')
    + `<button class="chip${c ? ' sel' : ''}" data-act="pickdate">${CAL_ICON}${label}</button></div>`
    + `<div class="datebox" id="datebox"${state.pickOpen ? '' : ' hidden'}><input type="date" id="dfrom" value="${c ? isoDay(c.from) : ''}" aria-label="From"><span class="to">to</span><input type="date" id="dto" value="${c ? isoDay(c.to - DAY) : ''}" aria-label="To (optional)"><button type="button" id="dapply">Show</button></div>`;
}

function exchanges() { return [...new Set(DATA.cycles.map(c => c.exchange).filter(Boolean))]; }

function viewStatus() {
  const t0 = startOfDay(0);
  const today = inRange(t0, t0 + DAY);
  const s = stats(today, 1);
  const last = DATA.cycles[0];
  const current = last ? last.balanceAfter : DATA.capital;
  const ret = DATA.capital ? (current - DATA.capital) / DATA.capital * 100 : 0;
  const d30 = dailyProfits(30);
  const s30 = stats(inRange(t0 - 30 * DAY, t0), 30);
  const frac = Math.max(0.05, (Date.now() - t0) / DAY);
  const avgCyclesByNow = s30.n / 30 * frac;
  const equity = d30.map(d => d.bal).filter(b => b != null).concat([current]);

  const hero = `<p class="note" style="margin:0 0 10px"><span class="running"><span class="status-dot"></span>Running</span>${last ? ` · <a href="#/cycle/${last.id}">Cycle #${last.id} · ${money(last.amount)} · ${ago(last.ts)}</a>` : ''}</p><div class="eyebrow">${infoLabel('Balance')}</div>
    <div class="hero"><div class="n">${money(current)}</div>
    <div class="pills"><span class="pill ${ret >= 0 ? 'green' : 'red'}">${ret >= 0 ? '+' : '−'}${Math.abs(ret).toFixed(1)}% on ${money(DATA.capital)} capital</span><span class="pill">${money(s.profit, { plus: true })} today</span></div></div>
    ${sparkline(equity)}<div class="axis"><span>30 days ago</span><span>now</span></div>`;
  const tiles = `<div class="tiles">
    ${tile('Profit today', money(s.profit), { txt: `avg ${money(s30.dailyAvg)} · ${deltaText(s.profit, s30.dailyAvg).txt}`, cls: deltaText(s.profit, s30.dailyAvg).cls }, '', 'Profit Today')}
    ${tile('Win rate', s.n ? pct0(s.winrate) : '—', { txt: `30-day ${pct0(s30.winrate)}`, cls: s.n ? deltaText(s.winrate, s30.winrate).cls : '' })}
    ${tile('Cycles today', s.n, { txt: `avg ${Math.round(avgCyclesByNow)} by ${fmtTime(Date.now())}`, cls: deltaText(s.n, avgCyclesByNow).cls })}
    ${tile('Volume', money(s.volume), { txt: `avg ${money(s30.volume / 30)} per day` })}
  </div>`;
  const list = `<h2>Today’s cycles<a href="#/cycles" data-day="0">All ${today.length}</a></h2>
    <div class="list">${today.slice(0, 8).map(c => cycleCard(c)).join('') || card({ title: 'No cycles yet today', sub: '' })}</div>`;
  return (LOAD_FAILED ? errBox : '') + `<div class="layout two"><div>${hero}${tiles}</div><div>${list}</div></div>`;
}

function viewDay() {
  const idx = state.dayIdx;
  const c = state.custom;
  const f = c ? c.from : startOfDay(idx);
  const t = c ? c.to : f + DAY;
  const days = Math.max(1, Math.round((t - f) / DAY));
  const list = inRange(f, t);
  const s = stats(list, days);
  const base = dailyProfits(30 + (c ? 0 : idx)).slice(0, 30);
  const avg = base.reduce((a, d) => a + d.v, 0) / 30;
  const title = c ? (days === 1 ? fmtDay(f + DAY / 2) : `${fmtDay(f + DAY / 2)} – ${fmtDay(t - DAY / 2)}`) : dayLabel(idx);
  const gains = list.filter(c => c.profit >= 0).sort((a, b) => b.profit - a.profit).slice(0, 5);
  const losses = list.filter(c => c.profit < 0).sort((a, b) => a.profit - b.profit).slice(0, 5);

  const hero = `<div class="eyebrow">${title} · Total net profit${days > 1 ? ` · ${days} days` : ''}</div>
    <div class="hero"><div class="n">${money(s.profit)}</div><div class="pills">${days > 1 ? deltaPill(s.profit / days, avg, `per day vs 30-day avg ${money(avg)}`) : deltaPill(s.profit, avg, `vs 30-day avg ${money(avg)}`)}<span class="pill">${pct2(s.profitPct)} of capital</span></div></div>`;
  const tiles = `<div class="tiles">
    ${tile('Win rate', s.n ? pct0(s.winrate) : '—', { txt: `${s.wins} won · ${s.n - s.wins} lost` })}
    ${tile('Cycles', s.n, { txt: `${money(s.volume)} volume` })}
    ${tile('Gains', money(s.gain) + '<span class="sqi green"></span>', { txt: `top 5 made ${pct0(s.topGainShare)}` }, '', 'Total Gain')}
    ${tile('Losses', money(s.loss) + '<span class="sqi red"></span>', { txt: `top 5 made ${pct0(s.topLossShare)}` }, '', 'Total Loss')}
  </div>`;
  const lists = `<h2>Top earners</h2><div class="list">${gains.map(x => cycleCard(x, { showDay: days > 1, badge: 'green' })).join('') || card({ title: 'No winning cycles', sub: '' })}</div>
    <h2>Top losers</h2><div class="list">${losses.map(x => cycleCard(x, { showDay: days > 1, badge: 'red' })).join('') || card({ title: 'No losing cycles', sub: '' })}</div>`;
  return dayRail() + (LOAD_FAILED ? errBox : '')
    + `<div class="layout two"><div>${hero}${tiles}</div><div>${lists}</div></div>`;
}

function viewWeek() {
  const days = RANGE_DAYS[state.rangeIdx];
  const to = startOfDay(0), from = to - days * DAY;
  const s = stats(inRange(from, to), days);
  const prev = stats(inRange(from - days * DAY, from), days);
  const daily = dailyProfits(days);
  const current = DATA.cycles.length ? DATA.cycles[0].balanceAfter : DATA.capital;
  const best = daily.reduce((b, d) => d.v > b.v ? d : b, daily[0]);

  const hero = `<div class="eyebrow">${RANGE_CHIPS[state.rangeIdx]} · net profit · complete days ending yesterday</div>
    <div class="hero"><div class="n">${money(s.profit)}</div><div class="pills">${deltaPill(s.profit, prev.profit, `vs the ${days} days before`)}<span class="pill">${pct2(s.profitPct)} of capital</span></div></div>`;
  const tiles = `<div class="tiles">
    ${tile('Daily average', money(s.dailyAvg), { txt: `${pct2(s.dailyAvgPct)} of capital` }, '', 'Daily Average Profit')}
    ${tile('Win rate', pct0(s.winrate), { txt: `${s.n} cycles` })}
    ${tile('Best day', money(best.v), { txt: dayLabel(best.off) })}
    ${tile('Volume', money(s.volume), { txt: `${money(s.volume / days)} per day` })}
  </div>`;
  const chart = days <= 30 ? `<h2>Daily profit</h2>` + barChart(daily.map(d => ({ label: days <= 14 ? fmtDay(d.f + DAY / 2).replace(/ \w+$/, '') : fmtDayShort(d.f + DAY / 2), value: d.v })), s.dailyAvg) : '';
  const rows = daily.slice().reverse();
  const mob = `<div class="list mob">` + rows.map(d => card({ title: dayLabel(d.off), sub: `${d.n} cycles${d.bal != null ? ` · close ${money(d.bal)}` : ''}`, a: money(d.v, { plus: true }) + sqi(d.v), b: 'profit', acls: d.v < 0 ? 'negv' : d.v > 0 ? 'pos' : 'dim' })).join('') + `</div>`;
  const desk = `<div class="tblwrap desk"><table class="data"><thead><tr><th>Day</th><th class="r">Cycles</th><th class="r">${infoLabel('Profit')}</th><th class="r">${infoLabel('Balance')}</th></tr></thead><tbody>`
    + rows.map(d => `<tr><td>${dayLabel(d.off)}</td><td class="r">${d.n}</td><td class="r ${d.v < 0 ? 'negv' : d.v > 0 ? 'pos' : 'dim'}">${money(d.v, { plus: true })}${sqi(d.v)}</td><td class="r">${d.bal != null ? money(d.bal) : '—'}</td></tr>`).join('')
    + `</tbody></table></div>`;
  return rail(RANGE_CHIPS, state.rangeIdx, 'range') + (LOAD_FAILED ? errBox : '')
    + `<div class="layout two"><div>${hero}${tiles}${chart}</div><div><h2>Day by day<span class="dim" style="font-size:.85rem;font-weight:500">balance now ${money(current)}</span></h2>${mob}${desk}</div></div>`;
}

function viewCycles() {
  const idx = state.dayIdx;
  const f = startOfDay(idx);
  const all = inRange(f, f + DAY);
  const exs = exchanges();
  const list = exs.length ? all.filter(c => state.exch[c.exchange] !== false) : all;
  const s = stats(list, 1);
  const counts = {}; for (const c of all) counts[c.exchange] = (counts[c.exchange] || 0) + 1;

  const tiles = `<div class="tiles" style="margin-top:0">
    ${tile('Cycles', s.n, { txt: `${s.wins} won · ${s.n - s.wins} lost` })}
    ${tile('Profit', money(s.profit), { txt: `${pct2(s.profitPct)} of capital`, cls: s.profit < 0 ? 'bad' : '' })}
    ${tile('Volume', money(s.volume), null)}
    ${tile('Concentration', s.gain > 0 ? pct0(s.topGainShare) : '—', { txt: 'of gains from top 5' })}
  </div>`;
  const filters = exs.length ? `<div class="rail" style="margin-top:6px">` + exs.map(x =>
    `<button class="chip${state.exch[x] === false ? '' : ' on'}" data-exch="${esc(x)}">${esc(x)} ${counts[x] || 0}</button>`).join('') + `</div>` : '';
  const dl = `<div class="filters"><span class="dim" style="font-size:.9rem">${list.length} cycles · ${dayLabel(idx)}</span><a class="dl" href="#" id="dlcsv">Download CSV</a></div>`;
  return rail(DAY_CHIPS(), idx, 'day') + (LOAD_FAILED ? errBox : '') + tiles + filters + dl + cycleRows(list);
}

function downloadCsv() {
  const from = startOfDay(state.dayIdx);
  let list = inRange(from, from + DAY);
  if (state.exch) list = list.filter(c => state.exch[c.exchange] !== false);
  const head = 'id,date,exchange,cycle,capacity,amount_usd,profit_expected_pct,profit_actual_pct,profit_actual_usd,duration_ms';
  const rows = list.map(c => [
    c.id, new Date(c.ts).toISOString(), c.exchange || '', c.cycle,
    c.capacity != null ? c.capacity : '', c.amount,
    c.expectedPct != null ? c.expectedPct : '', (c.profit / c.amount * 100).toFixed(4),
    c.profit, c.durationMs != null ? c.durationMs : ''
  ].join(','));
  const blob = new Blob([head + '\n' + rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cycles-${new Date(from).toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function viewCycleDetail(id) {
  const c = DATA.cycles.find(x => x.id === +id);
  if (!c) return `<a class="back" href="#/cycles">&larr; Cycles</a>` + errBox;
  const balBefore = c.balanceAfter != null ? c.balanceAfter - c.profit : null;
  const actPct = c.profit / c.amount * 100;
  const head = `<a class="back" href="#/cycles">&larr; Cycles</a>
    <div class="eyebrow">Cycle ${c.id} · ${fmtDay(c.ts)} ${fmtTime(c.ts)}${c.exchange ? ` · ${esc(c.exchange)}` : ''}</div>
    <div class="hero"><div class="n" style="font-size:34px">${cyclePath(c.cycle)}</div>
    <div class="pills"><span class="pill ${c.profit >= 0 ? 'green' : 'red'}">${money(c.profit, { plus: true })} · ${pct2(actPct)}</span>${c.expectedPct != null ? `<span class="pill">expected ${pct2(c.expectedPct)}</span>` : ''}${c.durationMs != null ? `<span class="pill">${dur(c.durationMs)}</span>` : ''}</div></div>`;
  const trade = `<h2>Trade</h2><div class="kv">`
    + kvRow('Amount', money(c.amount))
    + (c.capacity != null ? kvRow('Capacity', money(c.capacity)) : '')
    + (c.capacity ? kvRow('Capacity used', pct0(c.amount / c.capacity * 100)) : '')
    + `</div><h2>Result</h2><div class="kv">`
    + (c.expectedPct != null ? kvRow('Profit Expected, %', pct2(c.expectedPct)) : '')
    + kvRow('Profit Actual, %', pct2(actPct))
    + kvRow('Profit Actual, usd', `<span class="${c.profit >= 0 ? 'pos' : 'negv'}">${money(c.profit, { plus: true })}</span>`)
    + (c.durationMs != null ? kvRow('Duration', dur(c.durationMs)) : '')
    + `</div><h2>Balance</h2><div class="kv">`
    + (balBefore != null ? kvRow('Balance Before', money(balBefore)) : '')
    + (c.balanceAfter != null ? kvRow('Balance After', money(c.balanceAfter)) : '')
    + `</div>`;
  let legs = '';
  if (c.legs && c.legs.length) {
    legs = `<h2>Legs</h2><div class="list mob">` + c.legs.map(l => card({ title: esc(l.pair), sub: `wanted ${l.wanted} · executed ${l.executed} · ${dur(l.durationMs)}`, a: pct2(l.slippagePct), b: 'slippage', acls: l.slippagePct > 0.5 ? 'negv' : '' })).join('') + `</div>`
      + `<div class="tblwrap desk"><table class="data"><thead><tr>${['Pair', 'Price Wanted', 'Price Executed', 'Duration', 'Slippage'].map((h, i) => `<th class="${i ? 'r' : ''}">${infoLabel(h)}</th>`).join('')}</tr></thead><tbody>`
      + c.legs.map(l => `<tr><td>${esc(l.pair)}</td><td class="r">${l.wanted}</td><td class="r">${l.executed}</td><td class="r">${dur(l.durationMs)}</td><td class="r ${l.slippagePct > 0.5 ? 'negv' : ''}">${pct2(l.slippagePct)}</td></tr>`).join('')
      + `</tbody></table></div>`;
  }
  return head + `<div class="layout two"><div>${trade}</div><div>${legs}</div></div>`;
}

/* ---------- router / events ---------- */

const NAV = [['#/status', 'Today'], ['#/day', 'Day'], ['#/week', 'Week'], ['#/cycles', 'Cycles']];

function render(opts = {}) {
  if (!DATA) return;
  const keep = opts.keepScroll ? window.scrollY : null;
  const hash = location.hash || '#/status';
  let html, current = hash;
  const detail = hash.match(/^#\/cycle\/(\d+)$/);
  if (detail) { html = viewCycleDetail(detail[1]); current = '#/cycles'; }
  else if (hash === '#/day') html = viewDay();
  else if (hash === '#/week') html = viewWeek();
  else if (hash === '#/cycles') html = viewCycles();
  else { html = viewStatus(); current = '#/status'; }
  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('nav.nav a').forEach(a => a.classList.toggle('current', a.getAttribute('href') === current));
  const clock = document.getElementById('clock');
  if (clock) clock.textContent = `${fmtDay(Date.now())} · ${fmtTime(Date.now())}`;
  if (keep != null) { window.scrollTo(0, keep); return; }
  window.scrollTo(0, 0);
  document.querySelectorAll('nav.nav a.current, .chip.sel').forEach(el => { try { el.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (e) {} });
  window.scrollTo(0, 0);
}

document.getElementById('nav').innerHTML = NAV.map(([h, l]) => `<a href="${h}">${l}</a>`).join('');

document.getElementById('view').addEventListener('click', e => {
  if (e.target.closest('#dlcsv')) { e.preventDefault(); downloadCsv(); return; }
  const dd = e.target.closest('a[data-day]');
  if (dd) { state.dayIdx = +dd.dataset.day; return; }
  const ex = e.target.closest('button[data-exch]');
  if (ex) { state.exch[ex.dataset.exch] = state.exch[ex.dataset.exch] === false; render(); return; }
  if (e.target.closest('#dapply')) {
    const from = document.getElementById('dfrom').value, to = document.getElementById('dto').value || from;
    if (!from) return;
    const f = new Date(from + 'T00:00:00').getTime(), t = new Date(to + 'T00:00:00').getTime() + DAY;
    if (t <= f) return;
    state.custom = { from: f, to: t }; state.pickOpen = false; render(); return;
  }
  const b = e.target.closest('.chip');
  if (!b) return;
  if (b.dataset.act === 'pickdate') { state.pickOpen = !state.pickOpen; render(); if (state.pickOpen) { const i = document.getElementById('dfrom'); if (i) i.focus(); } return; }
  if (b.dataset.act === 'day') { state.dayIdx = +b.dataset.i; state.custom = null; state.pickOpen = false; }
  else state.rangeIdx = +b.dataset.i;
  render();
});

window.addEventListener('hashchange', () => render());
/* Re-render only when the width changes: phone browsers fire resize as their toolbar hides and shows while scrolling. */
let resizeT, lastW = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastW) return;
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const narrowChanged = (lastW < 640) !== (window.innerWidth < 640);
    lastW = window.innerWidth;
    if (narrowChanged) render({ keepScroll: true });
  }, 150);
});

/* Metric definition overlay */
function showDef(label) {
  const d = DEFS[label];
  if (!d) return;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="defcard"><h3>${esc(label)}</h3><p>${esc(d)}</p></div>`;
  scrim.addEventListener('click', () => scrim.remove());
  document.body.appendChild(scrim);
}
document.body.addEventListener('click', e => {
  const b = e.target.closest('button.i');
  if (b) { e.preventDefault(); e.stopPropagation(); showDef(b.dataset.def); }
}, true);

loadData().then(render);

</script>
